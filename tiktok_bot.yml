name: Run TikTok Bot Auto-Pilot

on:
  schedule:
    # Pagi 06:00 WIB (23:00 UTC) — menangkap morning scrollers sebelum kerja/kuliah
    - cron: '0 23 * * *'
    # Siang 12:00 WIB (05:00 UTC) — jam istirahat kantor
    - cron: '0 5 * * *'
    # Malam 18:00 WIB (11:00 UTC) — prime time setelah pulang kerja
    - cron: '0 11 * * *'
  workflow_dispatch:
    inputs:
      channel:
        description: 'Channel ID spesifik (kosongkan untuk jalankan semua 3 channel fokus)'
        required: false
        default: ''

jobs:
  # ─── JOB 1: Buat & Upload Video per Channel ──────────────────────────────
  buat-video:
    name: "Buat Video — ${{ matrix.channel }}"
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      matrix:
        channel: [ruangpikir, misterisemesta, animasi_ai]
      fail-fast: false
      max-parallel: 1   # Jalankan satu per satu agar tidak bentrok di storage

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install \
          google-genai \
          edge-tts \
          moviepy \
          playwright \
          numpy \
          yt-dlp \
          firebase-admin \
          google-cloud-firestore \
          requests \
          Pillow

    - name: Install Playwright Browser
      run: python -m playwright install chromium

    - name: Setup Credentials
      env:
        FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        TIKTOK_COOKIES: ${{ secrets.TIKTOK_COOKIES }}
      run: |
        if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
          echo "$FIREBASE_SERVICE_ACCOUNT" > firebase_service_account.json
          echo "Firebase credentials berhasil ditulis."
        else
          echo "PERINGATAN: FIREBASE_SERVICE_ACCOUNT secret tidak ditemukan."
        fi
        if [ -n "$YOUTUBE_COOKIES" ]; then
          echo "$YOUTUBE_COOKIES" > cookies.txt
          echo "YouTube cookies berhasil ditulis."
        fi
        if [ -n "$TIKTOK_COOKIES" ]; then
          echo "$TIKTOK_COOKIES" > tiktok_cookies.txt
          echo "TikTok cookies berhasil ditulis."
        fi

    - name: "Jalankan Bot — ${{ matrix.channel }}"
      timeout-minutes: 70
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        ENABLE_YOUTUBE_UPLOAD: ${{ secrets.ENABLE_YOUTUBE_UPLOAD }}
        ENABLE_TIKTOK_UPLOAD: ${{ secrets.ENABLE_TIKTOK_UPLOAD }}
        CLOUDFLARE_WORKER_URL: ${{ secrets.CLOUDFLARE_WORKER_URL }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        python app.py --channel ${{ matrix.channel }}

  # ─── JOB 2: Sinkronisasi Analytics & Learning Loop ───────────────────────
  # Hanya jalan sekali sehari (malam 18:00 WIB) atau saat manual dispatch
  sinkron-analytics:
    name: "Sinkronisasi Analytics & AI Learning"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: buat-video
    if: >
      always() && (
        github.event.schedule == '0 11 * * *' ||
        github.event_name == 'workflow_dispatch'
      )

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies Analytics
      run: |
        python -m pip install --upgrade pip
        pip install \
          google-genai \
          firebase-admin \
          google-cloud-firestore \
          requests

    - name: Setup Credentials
      env:
        FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
      run: |
        if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
          echo "$FIREBASE_SERVICE_ACCOUNT" > firebase_service_account.json
        fi
        if [ -n "$YOUTUBE_COOKIES" ]; then
          echo "$YOUTUBE_COOKIES" > cookies.txt
        fi

    - name: Jalankan Analytics Sync & AI Learning Loop
      timeout-minutes: 25
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        python analytics_sync.py
