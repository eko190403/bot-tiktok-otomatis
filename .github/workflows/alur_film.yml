name: Bot TikTok Alur Cerita Film

on:
  workflow_dispatch:
  
  repository_dispatch:
    types:
      - run-alur-film

  schedule:
    # Sedikit digeser 1 jam dari channel utama agar tidak bentrok
    # Target Pagi (08:00 WIB)   -> Cron diset 06:00 WIB (23:00 UTC)
    # Target Siang (13:00 WIB)  -> Cron diset 11:00 WIB (04:00 UTC)
    # Target Malam (20:00 WIB)  -> Cron diset 18:00 WIB (11:00 UTC)
    - cron: '0 4,11,23 * * *'
    # Cron mingguan untuk pembersihan draf lama
    - cron: '0 21 * * 1'

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    concurrency:
      group: bot-tiktok-alurfilm
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      ENABLE_VISUAL_CTA: "false"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Bersihkan Workspace
        run: |
          rm -rf temp/*
          rm -rf output/*
          mkdir -p temp output assets/fonts

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install FFmpeg dan ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick
          
          # Membuka izin akses ImageMagick agar MoviePy bisa merender teks/subtitle secara universal
          sudo find /etc/ImageMagick* -name "policy.xml" -exec sed -i 's/domain="path" rights="none"/domain="path" rights="read|write"/' {} + || true

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Install Playwright Chromium & System Dependencies
        run: |
          python -m playwright install --with-deps chromium

      - name: Kirim Notifikasi Proses Dimulai ke Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=Perintah diterima! Bot Animasi AI mulai memproses. Mohon tunggu..."

      - name: Siapkan Cookies TikTok dari Secret
        env:
          TIKTOK_COOKIES: ${{ secrets.TIKTOK_COOKIES }}
        run: |
          if [ -n "$TIKTOK_COOKIES" ]; then
            echo " Menulis berkas cookies.json secara dinamis dari GitHub Secrets..."
            echo "$TIKTOK_COOKIES" > cookies.json
          else
            echo " Secret TIKTOK_COOKIES tidak diset. Menggunakan berkas cookies.json bawaan dari repositori."
          fi

      - name: Siapkan Kredensial YouTube dari Secret
        env:
          YT_CREDS_ANIMASIAI: ${{ secrets.YT_CREDS_ANIMASIAI }}
        run: |
          echo "Menyiapkan kredensial YouTube untuk Animasi AI..."
          [ -n "$YT_CREDS_ANIMASIAI" ] && echo "$YT_CREDS_ANIMASIAI" > youtube_credentials_animasi_ai.json || echo "⚠️ Secret YT_CREDS_ANIMASIAI belum di-set"

      - name: Siapkan Akun Layanan Firebase dari Secret
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo " Menulis berkas firebase_service_account.json secara dinamis dari GitHub Secrets..."
            echo "$FIREBASE_SERVICE_ACCOUNT" > firebase_service_account.json
          else
            echo " Secret FIREBASE_SERVICE_ACCOUNT tidak diset. Menggunakan fallback database lokal."
          fi

      - name: Jalankan Bot Alur Cerita Film
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GEMINI_API_KEY_6: ${{ secrets.GEMINI_API_KEY_6 }}
          GEMINI_API_KEY_7: ${{ secrets.GEMINI_API_KEY_7 }}
          GEMINI_API_KEY_8: ${{ secrets.GEMINI_API_KEY_8 }}
          HF_API_KEY_1: ${{ secrets.HF_API_KEY_1 }}
          HF_API_KEY_2: ${{ secrets.HF_API_KEY_2 }}
          HF_API_KEY_3: ${{ secrets.HF_API_KEY_3 }}
          HF_API_KEY_4: ${{ secrets.HF_API_KEY_4 }}
          HF_API_KEY_5: ${{ secrets.HF_API_KEY_5 }}
          HF_API_KEY_6: ${{ secrets.HF_API_KEY_6 }}
          HF_API_KEY_7: ${{ secrets.HF_API_KEY_7 }}
          HF_API_KEY_8: ${{ secrets.HF_API_KEY_8 }}
          FAL_API_KEY_1: ${{ secrets.FAL_API_KEY_1 }}
          FAL_API_KEY_2: ${{ secrets.FAL_API_KEY_2 }}
          FAL_API_KEY_3: ${{ secrets.FAL_API_KEY_3 }}
          FAL_API_KEY_4: ${{ secrets.FAL_API_KEY_4 }}
          FAL_API_KEY_5: ${{ secrets.FAL_API_KEY_5 }}
          FAL_API_KEY_6: ${{ secrets.FAL_API_KEY_6 }}
          FAL_API_KEY_7: ${{ secrets.FAL_API_KEY_7 }}
          FAL_API_KEY_8: ${{ secrets.FAL_API_KEY_8 }}
          KLING_API_KEY_1: ${{ secrets.KLING_API_KEY_1 }}
          KLING_API_KEY_2: ${{ secrets.KLING_API_KEY_2 }}
          KLING_API_KEY_3: ${{ secrets.KLING_API_KEY_3 }}
          KLING_API_KEY_4: ${{ secrets.KLING_API_KEY_4 }}
          KLING_API_KEY_5: ${{ secrets.KLING_API_KEY_5 }}
          KLING_API_KEY_6: ${{ secrets.KLING_API_KEY_6 }}
          KLING_API_KEY_7: ${{ secrets.KLING_API_KEY_7 }}
          KLING_API_KEY_8: ${{ secrets.KLING_API_KEY_8 }}
          ENABLE_TIKTOK_UPLOAD: "false"
          ENABLE_YOUTUBE_UPLOAD: "false"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES1 }}
          IG_COOKIES: ${{ secrets.IG_COOKIES }}
        run: |
          if [ -n "$YOUTUBE_COOKIES" ]; then
            echo "$YOUTUBE_COOKIES" > cookies.txt
            echo "🍪 Berkas cookies.txt berhasil dibuat dari GitHub Secrets (YOUTUBE_COOKIES1)"
          fi
          
          if [ -n "$IG_COOKIES" ]; then
            echo "$IG_COOKIES" > ig_cookies.txt
            echo "🍪 Berkas ig_cookies.txt berhasil dibuat dari GitHub Secrets (IG_COOKIES)"
          fi
          
          echo "🚀 Menjalankan pipeline khusus Alur Cerita Film..."
          python app.py --channel alur_film || echo "⚠️ Gagal di alur_film, selesai."

      - name: Lihat Hasil Output
        if: always()
        run: |
          echo "Isi folder output:"
          ls -lah output || true

      - name: Kirim Hasil Video ke Telegram (Mode Test)
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          for file in output/*.mp4; do
            if [ -f "$file" ]; then
              echo "Mengirim $file ke Telegram..."
              curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendVideo" \
                -F "chat_id=${TELEGRAM_CHAT_ID}" \
                -F "video=@$file" \
                -F "caption=🚀 Test Generasi Animasi AI Selesai!"
            fi
          done

      - name: Upload Hasil Video
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: video-tiktok-animasia
          path: output/
          retention-days: 7

      - name: Kirim Notifikasi GAGAL ke Telegram
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "parse_mode=HTML" \
            -d "text=<b>PIPELINE ANIMASI AI GAGAL!</b>%0A%0A Bot Animasi AI mengalami error saat menjalankan workflow.%0A%0A🔗 Cek log: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
