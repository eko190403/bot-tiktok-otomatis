name: Maintenance

on:
  schedule:
    - cron: '0 3 * * 1' # Weekly on Monday 03:00 UTC (10:00 WIB)
  workflow_dispatch:

jobs:
  prune-used-clips:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true

      - name: Prepare Firebase Service Account
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "$FIREBASE_SERVICE_ACCOUNT" > firebase_service_account.json
            echo "✅ Firebase service account siap."
          else
            echo "⚠️ Secret FIREBASE_SERVICE_ACCOUNT tidak ditemukan. Prune mungkin gagal."
          fi

      - name: Run prune used_clips
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          python scripts/prune_used_clips.py --days 90
          echo "✅ Prune selesai."

      - name: Kirim Notifikasi Gagal ke Telegram
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "parse_mode=HTML" \
            -d "text=<b>⚠️ Maintenance Gagal!</b>%0A%0A Script prune_used_clips mengalami error.%0A%0A🔗 Cek log: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
