name: Bot TikTok Auto-Pilot

on:
  workflow_dispatch:

  schedule:
    - cron: '0 4,10,14 * * *'
    - cron: '0 20 * * 1'

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write
    env:
      ENABLE_VISUAL_CTA: "true"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install FFmpeg dan ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick
          sudo find /etc/ImageMagick* -name "policy.xml" -exec sed -i 's/domain="path" rights="none"/domain="path" rights="read|write"/' {} + || true

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Install Playwright Chromium & System Dependencies
        run: |
          python -m playwright install --with-deps chromium

      - name: Kirim Notifikasi Proses Dimulai ke Telegram
        if: github.event.action != 'telegram_publish'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=Pipeline dimulai! Memproses 5 channel satu per satu. Mohon tunggu..."

      - name: Siapkan Cookies TikTok dari Secret
        env:
          TIKTOK_COOKIES: ${{ secrets.TIKTOK_COOKIES }}
        run: |
          if [ -n "$TIKTOK_COOKIES" ]; then
            echo "$TIKTOK_COOKIES" > cookies.json
          fi

      - name: Siapkan Kredensial YouTube dari Secret
        env:
          YT_CREDS_RUANGPIKIR: ${{ secrets.YT_CREDS_RUANGPIKIR }}
          YT_CREDS_LOGIKASTOIK: ${{ secrets.YT_CREDS_LOGIKASTOIK }}
          YT_CREDS_RAHASIAFINANSIAL: ${{ secrets.YT_CREDS_RAHASIAFINANSIAL }}
          YT_CREDS_MISTERISEMESTA: ${{ secrets.YT_CREDS_MISTERISEMESTA }}
          YT_CREDS_POLADISIPLIN: ${{ secrets.YT_CREDS_POLADISIPLIN }}
          YT_CREDS_KOMEDIHUNTER: ${{ secrets.YT_CREDS_KOMEDIHUNTER }}
        run: |
          [ -n "$YT_CREDS_RUANGPIKIR" ] && echo "$YT_CREDS_RUANGPIKIR" > youtube_credentials_ruangpikir.json || true
          [ -n "$YT_CREDS_LOGIKASTOIK" ] && echo "$YT_CREDS_LOGIKASTOIK" > youtube_credentials_logikastoik.json || true
          [ -n "$YT_CREDS_RAHASIAFINANSIAL" ] && echo "$YT_CREDS_RAHASIAFINANSIAL" > youtube_credentials_rahasiafinansial.json || true
          [ -n "$YT_CREDS_MISTERISEMESTA" ] && echo "$YT_CREDS_MISTERISEMESTA" > youtube_credentials_misterisemesta.json || true
          [ -n "$YT_CREDS_POLADISIPLIN" ] && echo "$YT_CREDS_POLADISIPLIN" > youtube_credentials_poladisiplin.json || true
          [ -n "$YT_CREDS_KOMEDIHUNTER" ] && echo "$YT_CREDS_KOMEDIHUNTER" > youtube_credentials_komedihunter.json || true

      - name: Siapkan Akun Layanan Firebase dari Secret
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "$FIREBASE_SERVICE_ACCOUNT" > firebase_service_account.json
          fi

      - name: Jalankan Bot (Sequential per Channel)
        if: github.event.action != 'telegram_publish' && github.event.action != 'run-analytics'
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GEMINI_API_KEY_6: ${{ secrets.GEMINI_API_KEY_6 }}
          GEMINI_API_KEY_7: ${{ secrets.GEMINI_API_KEY_7 }}
          GEMINI_API_KEY_8: ${{ secrets.GEMINI_API_KEY_8 }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ENABLE_TIKTOK_UPLOAD: "true"
          ENABLE_YOUTUBE_UPLOAD: "true"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES1 }}
          IG_COOKIES: ${{ secrets.IG_COOKIES }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        run: |
          if [ -n "$YOUTUBE_COOKIES" ]; then
            echo "$YOUTUBE_COOKIES" > cookies.txt
          fi
          if [ -n "$IG_COOKIES" ]; then
            echo "$IG_COOKIES" > ig_cookies.txt
          fi

          CHANNELS="ruangpikir logikastoik rahasiafinansial misterisemesta poladisiplin"
          FAILED=""
          SUCCESS=0
          for CH in $CHANNELS; do
            echo ""
            echo "=========================================="
            echo "  Channel: $CH"
            echo "=========================================="

            rm -rf temp/* output/*
            mkdir -p temp output

            if timeout 2700 python app.py --channel "$CH"; then
              echo "  $CH selesai."
              SUCCESS=$((SUCCESS + 1))
            else
              echo "  $CH GAGAL."
              FAILED="$FAILED $CH"
            fi
          done

          echo ""
          echo "=========================================="
          echo "  HASIL: $SUCCESS/5 channel berhasil"
          if [ -n "$FAILED" ]; then
            echo "  Gagal:$FAILED"
          fi
          echo "=========================================="

      - name: Jalankan Remote Control Publisher (Kirim ke Medsos)
        if: github.event.action == 'telegram_publish'
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python remote_publisher.py \
            --video_id "${{ github.event.client_payload.video_id }}" \
            --platform "${{ github.event.client_payload.platform }}" \
            --chat_id "${{ github.event.client_payload.chat_id }}"

      - name: Jalankan Analytics Sync (Tarik Data dari YouTube)
        if: github.event.action == 'run-analytics'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python analytics_sync.py

      - name: Lihat Hasil Output
        if: always()
        run: |
          echo "Isi folder output:"
          ls -lah output || true

      - name: Kirim Notifikasi GAGAL ke Telegram
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "parse_mode=HTML" \
            -d "text=<b>PIPELINE GAGAL!</b>%0A%0A🔗 Log: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
